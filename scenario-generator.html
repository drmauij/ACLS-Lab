
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACLS Scenario Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #252525;
            color: #e8e8e8;
            font-family: 'Poppins', sans-serif;
        }
        
        .card {
            background-color: #3a3a39;
            border: 1px solid #3a3a39;
        }
        
        .card-header {
            background-color: #2a2a29;
            border-bottom: 1px solid #3a3a39;
            color: #e8e8e8;
        }
        
        .form-control, .form-select {
            background-color: #2a2a29;
            border: 1px solid #3a3a39;
            color: #e8e8e8;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: #2a2a29;
            border-color: #007bff;
            color: #e8e8e8;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        
        .form-label {
            color: #e8e8e8;
        }
        
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        
        .scenario-output {
            background-color: #2a2a29;
            border: 1px solid #3a3a39;
            border-radius: 0.375rem;
            padding: 1rem;
            font-family: 'Source Code Pro', 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            color: #e8e8e8;
        }
        
        .step-preview {
            background-color: #3a3a39;
            border-left: 4px solid #007bff;
            padding: 0.5rem;
            margin: 0.5rem 0;
            color: #e8e8e8;
        }
        
        h1, h5 {
            color: #e8e8e8;
        }
        
        .form-control::placeholder {
            color: #b6b6b6;
        }
        
        .form-select option {
            background-color: #2a2a29;
            color: #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">ACLS Scenario Generator</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Scenario Details</h5>
                    </div>
                    <div class="card-body">
                        <form id="scenarioForm">
                            <div class="mb-3">
                                <label for="scenarioTitle" class="form-label">Scenario Title</label>
                                <input type="text" class="form-control" id="scenarioTitle" placeholder="e.g., Cardiac Arrest in Restaurant">
                            </div>
                            
                            <div class="mb-3">
                                <label for="scenarioDescription" class="form-label">Scenario Description</label>
                                <textarea class="form-control" id="scenarioDescription" rows="3" placeholder="Describe the initial scenario setup..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="patientAge" class="form-label">Patient Age</label>
                                <input type="number" class="form-control" id="patientAge" placeholder="e.g., 65">
                            </div>
                            
                            <div class="mb-3">
                                <label for="primaryCondition" class="form-label">Primary Medical Condition</label>
                                <select class="form-select" id="primaryCondition">
                                    <option value="">Select condition...</option>
                                    <option value="cardiac_arrest">Cardiac Arrest</option>
                                    <option value="stemi">STEMI</option>
                                    <option value="choking">Choking</option>
                                    <option value="drowning">Drowning</option>
                                    <option value="pulmonary_embolism">Pulmonary Embolism</option>
                                    <option value="copd_exacerbation">COPD Exacerbation</option>
                                    <option value="trauma">Trauma</option>
                                    <option value="overdose">Drug Overdose</option>
                                    <option value="anaphylaxis">Anaphylaxis</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="complications" class="form-label">Complications (optional)</label>
                                <textarea class="form-control" id="complications" rows="2" placeholder="Any complications or secondary conditions..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="initialRhythm" class="form-label">Initial Rhythm</label>
                                <select class="form-select" id="initialRhythm">
                                    <option value="">Select rhythm...</option>
                                    <option value="VF">Ventricular Fibrillation</option>
                                    <option value="VT">Ventricular Tachycardia</option>
                                    <option value="Asystole">Asystole</option>
                                    <option value="Brady">Bradycardia</option>
                                    <option value="SR">Sinus Rhythm</option>
                                    <option value="SVT">Supraventricular Tachycardia</option>
                                </select>
                            </div>
                            
                            <button type="button" class="btn btn-primary" onclick="generateScenario()">Generate Scenario</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Generated Scenario</h5>
                    </div>
                    <div class="card-body">
                        <div id="scenarioPreview" class="mb-3"></div>
                        <div id="scenarioOutput" class="scenario-output"></div>
                        <button type="button" class="btn btn-success mt-2" onclick="copyToClipboard()" style="display: none;" id="copyBtn">Copy JSON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scenario-generator.js"></script>
</body>
</html>
