<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ACLS Chat Simulator</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui/dist/semantic.min.css" />
	<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/semantic-ui/dist/semantic.min.js"></script>
	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background-color: #1b1c1d;
			color: #ffffff;
			padding-top: 50px;
			padding-bottom: 60px;
		}
		.ui.inverted.segment, .ui.inverted.menu {
			background-color: #1b1c1d !important;
		}
		.chat-area {
			max-height: calc(100vh - 120px);
			overflow-y: auto;
			padding: 1em;
			background-color: #2f2f2f;
			border-radius: 8px;
		}
		.vertical-toggle-btn {
			position: fixed;
			top: 50%;
			left: 0;
			transform: rotate(-90deg);
			transform-origin: left top;
			background: #333;
			color: white;
			padding: 0.5em 1em;
			cursor: pointer;
			z-index: 999;
			border-radius: 0 0 5px 5px;
		}
		.ui.sidebar {
			width: 260px;
			background-color: #222;
		}
		.ui.bottom.fixed.menu {
			background-color: #1b1c1d;
			border-top: 1px solid #333;
		}
		.ui.dropdown .menu>.item {
			color: #fff !important;
		}
		
		/* Start Modal Dark Theme */
		#startModal.ui.modal {
			background: linear-gradient(145deg, #111827 0%, #1f2937 100%) !important;
			border: 1px solid #374151 !important;
			border-radius: 16px !important;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
			backdrop-filter: blur(20px);
			color: #e5e7eb !important;
		}
		
		#startModal .ui.modal > .header {
			background: linear-gradient(145deg, #1f2937 0%, #374151 100%) !important;
			color: #f9fafb !important;
			border-bottom: 1px solid #4b5563 !important;
			border-radius: 16px 16px 0 0 !important;
			padding: 1.5rem !important;
			font-weight: 600;
			font-size: 1.25rem;
		}
		
		#startModal .content {
			padding: 2rem !important;
			background: transparent !important;
		}
		
		#startModal .content p {
			font-size: 1.1rem;
			line-height: 1.6;
			margin-bottom: 2rem;
			color: #d1d5db !important;
			background: transparent !important;
		}
		
		/* Scenario Dropdown Styling */
		#scenarioDropdown {
			font-size: 1.1rem !important;
			padding: 1rem !important;
			background: rgba(15, 23, 42, 0.8) !important;
			border: 1px solid #374151 !important;
			border-radius: 8px !important;
			color: #e5e7eb !important;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2) !important;
		}
		
		#scenarioDropdown .default.text {
			color: #9ca3af !important;
			background: transparent !important;
		}
		
		#scenarioDropdown .text {
			color: #e5e7eb !important;
			background: transparent !important;
		}
		
		#scenarioDropdown .menu {
			background: rgba(15, 23, 42, 0.95) !important;
			border: 1px solid #374151 !important;
			border-radius: 6px !important;
			box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.4) !important;
			backdrop-filter: blur(10px);
			max-height: 250px !important;
			overflow-y: auto !important;
		}
		
		#scenarioDropdown .menu .item {
			color: #d1d5db !important;
			background: transparent !important;
			border-bottom: 1px solid rgba(55, 65, 81, 0.3) !important;
			padding: 0.75rem 1rem !important;
			transition: all 0.2s ease;
		}
		
		#scenarioDropdown .menu .item:last-child {
			border-bottom: none !important;
		}
		
		#scenarioDropdown .menu .item:hover {
			background: rgba(59, 130, 246, 0.1) !important;
			color: #f9fafb !important;
		}
		
		#scenarioDropdown .menu .item.selected {
			background: rgba(59, 130, 246, 0.2) !important;
			color: #93c5fd !important;
		}
		
		/* Custom scrollbar for dropdown */
		#scenarioDropdown .menu::-webkit-scrollbar {
			width: 6px;
		}
		
		#scenarioDropdown .menu::-webkit-scrollbar-track {
			background: rgba(55, 65, 81, 0.2);
			border-radius: 3px;
		}
		
		#scenarioDropdown .menu::-webkit-scrollbar-thumb {
			background: rgba(107, 114, 128, 0.5);
			border-radius: 3px;
		}
		
		#scenarioDropdown .menu::-webkit-scrollbar-thumb:hover {
			background: rgba(107, 114, 128, 0.7);
		}
		
		/* Modal Actions */
		#startModal .actions {
			background: linear-gradient(145deg, #111827 0%, #1f2937 100%) !important;
			border-top: 1px solid #4b5563 !important;
			border-radius: 0 0 16px 16px !important;
			padding: 1.5rem !important;
		}
		
		#startModal .actions .ui.button {
			background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important;
			color: white !important;
			border: none !important;
			border-radius: 8px !important;
			padding: 0.75rem 1.5rem !important;
			font-weight: 600;
			transition: all 0.3s ease;
			box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
		}
		
		#startModal .actions .ui.button:hover {
			background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%) !important;
			transform: translateY(-2px);
			box-shadow: 0 8px 25px -5px rgba(59, 130, 246, 0.4);
		}
		
		#startModal .actions .ui.button:active {
			transform: translateY(0);
		}
		
		/* Mobile responsive adjustments */
		@media (max-width: 768px) {
			#startModal.ui.modal {
				width: 95% !important;
				margin: 0 auto !important;
				position: fixed !important;
				top: 10% !important;
				left: 2.5% !important;
				max-height: 80vh !important;
			}
			
			#startModal .content {
				padding: 1rem !important;
			}
			
			#startModal .content p {
				font-size: 0.95rem !important;
				margin-bottom: 1.5rem !important;
			}
			
			#scenarioDropdown {
				font-size: 0.9rem !important;
				padding: 0.75rem !important;
			}
		}
	</style>
</head>
<body>
	<!-- Sticky Header -->
	<div class="ui top fixed inverted menu">
		<div class="item">
			<img src="logo.png" alt="Logo" style="height: 30px" />
		</div>
		<div class="right menu">
			<div class="item">
				Realtime
				<div class="ui toggle checkbox">
					<input type="checkbox" name="realtime">
					<label></label>
				</div>
			</div>
		</div>
	</div>

	<!-- Sidebar Toggle Button (Mobile) -->
	<div class="vertical-toggle-btn" onclick="$('.ui.sidebar').sidebar('toggle')">Monitor & Logs</div>

	<!-- Sidebar + Main Chat -->
	<div class="ui pushable">
		<div class="ui vertical inverted sidebar menu">
			<div class="item header">Vitals</div>
			<div class="item">HR: 110 bpm</div>
			<div class="item">BP: 90/60 mmHg</div>
			<div class="item header">Labs</div>
			<div class="item">pH: 7.2</div>
			<div class="item">K+: 5.0</div>
			<div class="item header">Logs</div>
			<div class="item">[00:01] CPR started</div>
		</div>

		<div class="ui basic segment">
			<div class="ui container">
				<div class="chat-area" id="chat">
					<div class="ui comments">
						<div class="comment">
							<div class="content">
								<div class="text">Scenario started. Patient unresponsive.</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Sticky Footer -->
	<div class="ui bottom fixed inverted menu">
		<div class="item" style="width: 50%">
			<button class="ui fluid button" onclick="$('#actionModal').modal('show')">
				<i class="search icon"></i> Actions/Drugs
			</button>
		</div>
		<div class="item" style="width: 50%">
			<button class="ui fluid button" onclick="$('#historyModal').modal('show')">
				<i class="clipboard list icon"></i> History
			</button>
		</div>
	</div>

	<!-- Start Modal -->
	<div class="ui small modal" id="startModal">
		<div class="header">Select ACLS Scenario</div>
		<div class="content">
			<div class="ui fluid selection dropdown" id="scenarioDropdown">
				<input type="hidden" name="scenario">
				<i class="dropdown icon"></i>
				<div class="default text">Choose a scenario</div>
				<div class="menu">
					<div class="item" data-value="vfib">V-Fib Arrest</div>
					<div class="item" data-value="pea">PEA</div>
				</div>
			</div>
		</div>
		<div class="actions">
			<button class="ui primary button" onclick="startScenario()">Start</button>
		</div>
	</div>

	<!-- Action Modal -->
	<div class="ui small modal" id="actionModal">
		<div class="header">Search Action or Drug</div>
		<div class="content">
			<div class="ui fluid search">
				<input class="prompt" type="text" placeholder="Search actions...">
				<div class="results"></div>
			</div>
		</div>
	</div>

	<!-- History Modal -->
	<div class="ui small modal" id="historyModal">
		<div class="header">Action History</div>
		<div class="content">
			<p>CPR started at 00:01<br>Epinephrine 1mg at 00:03</p>
		</div>
	</div>

	<script>
		$(document).ready(function () {
			$('#startModal').modal({ closable: false }).modal('show');
			$('#scenarioDropdown').dropdown();
			$('.ui.checkbox').checkbox();
		});

		function startScenario() {
			const selected = $('#scenarioDropdown').dropdown('get value');
			if (selected) {
				$('#startModal').modal('hide');
				$('#chat').append(`<div class="comment"><div class="content"><div class="text">Scenario loaded: ${selected}</div></div></div>`);
			}
		}
	</script>
</body>
</html>
