<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ACLS Chat Simulator</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui/dist/semantic.min.css" />
	<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/semantic-ui/dist/semantic.min.js"></script>
	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background-color: #1b1c1d;
			color: #ffffff;
			padding-top: 50px;
			padding-bottom: 60px;
		}
		.ui.inverted.segment,
		.ui.inverted.menu,
		.ui.inverted.dropdown,
		.ui.inverted.modal,
		.ui.inverted.button,
		.ui.inverted.table {
			background-color: #1b1c1d !important;
			color: #ffffff !important;
		}
		.chat-area {
			max-height: calc(100vh - 120px);
			overflow-y: auto;
			padding: 1em;
			background-color: #2f2f2f;
			border-radius: 8px;
		}
		.vertical-toggle-btn {
			position: fixed;
			top: 50%;
			left: 0;
			transform: rotate(-90deg);
			transform-origin: left top;
			background: #333;
			color: white;
			padding: 0.5em 1em;
			cursor: pointer;
			z-index: 999;
			border-radius: 0 0 5px 5px;
		}
		.ui.sidebar {
			width: 260px;
			background-color: #222 !important;
			color: white !important;
		}
		.ui.bottom.fixed.menu {
			background-color: #1b1c1d;
			border-top: 1px solid #333;
		}
		/* Semantic UI Dark Theme Dropdown Styling */
		.ui.dropdown,
		.ui.dropdown.inverted {
			background-color: #1b1c1d !important;
			color: #ffffff !important;
			border: 1px solid #767676 !important;
		}
		
		.ui.dropdown .menu,
		.ui.dropdown.inverted .menu {
			background-color: #1b1c1d !important;
			border: 1px solid #767676 !important;
		}
		
		.ui.dropdown .menu>.item,
		.ui.dropdown.inverted .menu>.item {
			color: rgba(255, 255, 255, 0.9) !important;
			background-color: transparent !important;
		}
		
		.ui.dropdown .menu>.item:hover,
		.ui.dropdown.inverted .menu>.item:hover {
			background-color: rgba(255, 255, 255, 0.08) !important;
			color: #ffffff !important;
		}
		
		.ui.dropdown .menu>.item.selected,
		.ui.dropdown.inverted .menu>.item.selected {
			background-color: rgba(255, 255, 255, 0.15) !important;
			color: #ffffff !important;
		}
		
		.ui.dropdown.selection,
		.ui.dropdown.inverted.selection,
		.ui.selection.dropdown,
		.ui.selection.inverted.dropdown {
			background-color: #1b1c1d !important;
			color: #ffffff !important;
			border-color: #767676 !important;
		}
		
		.ui.dropdown.selection>.text,
		.ui.dropdown.inverted.selection>.text,
		.ui.selection.dropdown>.text,
		.ui.selection.inverted.dropdown>.text {
			color: rgba(255, 255, 255, 0.87) !important;
		}
		
		.ui.dropdown.selection>.default.text,
		.ui.dropdown.inverted.selection>.default.text {
			color: rgba(255, 255, 255, 0.5) !important;
		}
		.ui.modal.inverted .header,
		.ui.modal.inverted .content,
		.ui.modal.inverted .actions {
			background-color: #1b1c1d !important;
			color: #ffffff !important;
		}
		.ui.inverted.button,
		.ui.inverted.buttons .button {
			background-color: #2f2f2f !important;
			color: #ffffff !important;
			border: 1px solid #555 !important;
		}
		.ui.primary.button {
			background-color: #2185d0 !important;
			color: #fff !important;
		}
		.ui.search > .prompt {
			background-color: #2f2f2f !important;
			color: #ffffff !important;
			border: 1px solid #444 !important;
		}
		.ui.search > .results {
			background-color: #2f2f2f !important;
			color: #ffffff !important;
			border: 1px solid #444 !important;
		}

		/* Scenario dropdown specific styling using Semantic UI standards */
		#scenarioDropdown.ui.dropdown .menu .item {
			border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
			padding: 1rem 1.25rem !important;
			font-size: 1rem !important;
			transition: all 0.2s ease;
		}

		#scenarioDropdown.ui.dropdown .menu .item:last-child {
			border-bottom: none !important;
		}
	</style>
</head>
<body>
	<!-- Sticky Header -->
	<div class="ui top fixed inverted menu">
		<div class="item">
			<img src="logo.png" alt="Logo" style="height: 30px" />
		</div>
		<div class="right menu">
			<div class="item">
				Realtime
				<div class="ui toggle checkbox">
					<input type="checkbox" name="realtime">
					<label></label>
				</div>
			</div>
		</div>
	</div>

	<!-- Sidebar Toggle Button (Mobile) -->
	<div class="vertical-toggle-btn" onclick="$('.ui.sidebar').sidebar('toggle')">Monitor & Logs</div>

	<!-- Sidebar + Main Chat -->
	<div class="ui pushable">
		<div class="ui vertical inverted sidebar menu">
			<div class="item header">Vitals</div>
			<div class="item">HR: 110 bpm</div>
			<div class="item">BP: 90/60 mmHg</div>
			<div class="item header">Labs</div>
			<div class="item">pH: 7.2</div>
			<div class="item">K+: 5.0</div>
			<div class="item header">Logs</div>
			<div class="item">[00:01] CPR started</div>
		</div>

		<div class="ui basic segment">
			<div class="ui container">
				<div class="chat-area" id="chat">
					<div class="ui comments">
						<div class="comment">
							<div class="content">
								<div class="text">Scenario started. Patient unresponsive.</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Sticky Footer -->
	<div class="ui bottom fixed inverted menu">
		<div class="item" style="width: 50%">
			<button class="ui fluid inverted button" onclick="$('#actionModal').modal('show')">
				<i class="search icon"></i> Actions/Drugs
			</button>
		</div>
		<div class="item" style="width: 50%">
			<button class="ui fluid inverted button" onclick="$('#historyModal').modal('show')">
				<i class="clipboard list icon"></i> History
			</button>
		</div>
	</div>

	<!-- Start Modal -->
	<div class="ui small inverted modal" id="startModal">
		<div class="header">Select ACLS Scenario</div>
		<div class="content">
			<div class="ui fluid selection inverted dropdown" id="scenarioDropdown">
				<input type="hidden" name="scenario">
				<i class="dropdown icon"></i>
				<div class="default text">Choose a scenario</div>
				<div class="menu">
					<div class="item" data-value="vfib">V-Fib Arrest</div>
					<div class="item" data-value="pea">PEA</div>
				</div>
			</div>
		</div>
		<div class="actions">
			<button class="ui primary button" onclick="startScenario()">Start</button>
		</div>
	</div>

	<!-- Action Modal -->
	<div class="ui small inverted modal" id="actionModal">
		<div class="header">Search Actions or Drug</div>
		<div class="content">
			<div class="ui fluid search">
				<input class="prompt" type="text" placeholder="Search actions...">
				<div class="results"></div>
			</div>
		</div>
	</div>

	<!-- History Modal -->
	<div class="ui small inverted modal" id="historyModal">
		<div class="header">Action History</div>
		<div class="content">
			<p>CPR started at 00:01<br>Epinephrine 1mg at 00:03</p>
		</div>
	</div>

	<script>
		$(document).ready(function () {
			$('#startModal').modal({ closable: false }).modal('show');
			$('#scenarioDropdown').dropdown();
			$('.ui.checkbox').checkbox();
		});

		function startScenario() {
			const selected = $('#scenarioDropdown').dropdown('get value');
			if (selected) {
				$('#startModal').modal('hide');
				$('#chat').append(`<div class="comment"><div class="content"><div class="text">Scenario loaded: ${selected}</div></div></div>`);
			}
		}
	</script>
</body>
</html>
